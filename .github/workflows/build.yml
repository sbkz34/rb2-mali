name: Build Mali APK

# Rebuilds only the ReXGlue engine libraries of RB2-Android (librexruntimerd.so,
# librexgpu-xenosrd.so) and the Vulkan probe with the Mali patch, then swaps them into the
# official release APK and re-signs it. No game data is involved: these libraries contain no
# recompiled game code, and libmain.so is kept untouched from the official APK.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UPSTREAM: https://github.com/moddedrounds/RB2-Android.git
  UPSTREAM_COMMIT: 2965cfe          # v1.2.3, the release the APK below was built from
  RELEASE_APK: https://github.com/moddedrounds/RB2-Android/releases/download/v1.2.3/RB2-Android.apk
  RELEASE_SHA256: 2a1545ed89745f3ad92848304735b548449429f6b5c584898ae233854276635d
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.31.6
  BUILD_TOOLS: 35.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "build-tools;$BUILD_TOOLS" > /dev/null
          ln -sfn "$SDK" "$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq ninja-build spirv-cross > /dev/null

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch RB2-Android and apply the Mali patch
        run: bash ci/run.sh bash ci/fetch.sh

      - name: Prepare the patched ReXGlue SDK
        run: bash ci/run.sh bash ci/prepare_sdk.sh

      - name: Build the engine libraries (no game code)
        run: bash ci/run.sh bash ci/build_libs.sh

      - name: Swap the libraries into the official APK
        run: bash ci/run.sh bash ci/repack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RB2-Android-Mali
          path: ~/work/apk/RB2-Android-Mali.apk
          retention-days: 30

      - name: Publish as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mali-v1.2.3 --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create mali-v1.2.3 ~/work/apk/RB2-Android-Mali.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "RB2-Android 1.2.3 - Mali" \
            --notes "RB2-Android v1.2.3 with the Mali patch (engine libraries rebuilt). Uninstall the official app first, install this APK, then select your own ISO again."
