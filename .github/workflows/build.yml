name: Build Mali APK

# Rebuilds only the ReXGlue engine libraries of RB2-Android (librexruntimerd.so,
# librexgpu-xenosrd.so) and the Vulkan probe with the Mali patch, then swaps them into the
# official release APK and re-signs it. No game data is involved: these libraries contain no
# recompiled game code, and libmain.so is kept untouched from the official APK.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UPSTREAM: https://github.com/moddedrounds/RB2-Android.git
  UPSTREAM_COMMIT: 2965cfe          # v1.2.3, the release the APK below was built from
  RELEASE_APK: https://github.com/moddedrounds/RB2-Android/releases/download/v1.2.3/RB2-Android.apk
  RELEASE_SHA256: 2a1545ed89745f3ad92848304735b548449429f6b5c584898ae233854276635d
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.31.6
  BUILD_TOOLS: 35.0.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "build-tools;$BUILD_TOOLS" > /dev/null
          ln -sfn "$SDK" "$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          sudo apt-get install -y -qq ninja-build > /dev/null

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch RB2-Android and apply the Mali patch
        run: |
          mkdir -p "$HOME/work" && cd "$HOME/work"
          git clone "$UPSTREAM" RB2-Android
          cd RB2-Android
          git checkout -q "$UPSTREAM_COMMIT"
          git -c user.name=ci -c user.email=ci@localhost am "$GITHUB_WORKSPACE/patches/rb2-android-mali-support.patch"
          git log --oneline -2

      - name: Prepare the patched ReXGlue SDK
        run: |
          cd "$HOME/work"
          bash RB2-Android/tools/android/prepare_sdk.sh
          tail -3 rexglue-sdk-android/.android-patches/.applied

      - name: Build the engine libraries (no game code)
        run: |
          cd "$HOME/work/RB2-Android"
          # The native CMake project only reaches the SDK when generated game sources exist.
          # Give it a placeholder so it configures; libmain.so is never built.
          GEN="$HOME/work/fake-gen"
          mkdir -p "$GEN"
          echo 'set(GENERATED_SOURCES "${CMAKE_CURRENT_LIST_DIR}/placeholder.cpp")' > "$GEN/sources.cmake"
          echo '// placeholder' > "$GEN/placeholder.cpp"
          echo '#pragma once' > "$GEN/rb2_pch.h"
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          CMAKE="$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake"
          OUT="$HOME/work/native-build"
          FLAGS="-O3 -mtune=cortex-a715 -g -DNDEBUG"   # same as tools/android/build_native.sh
          "$CMAKE" -S android/native -B "$OUT" -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="$FLAGS" -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="$FLAGS" \
            -DTHPS_GEN_DIR="$GEN" -DTHPS_SDK="$HOME/work/rexglue-sdk-android"
          "$CMAKE" --build "$OUT" --parallel "$(nproc)" --target rexruntime rexgpu-xenos rb2probe

      - name: Swap the libraries into the official APK
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          W="$HOME/work/apk" && mkdir -p "$W/new/lib/arm64-v8a" "$W/old" && cd "$W"
          curl -fsSL -o official.apk "$RELEASE_APK"
          echo "$RELEASE_SHA256  official.apk" | sha256sum -c -
          find_lib() { find "$HOME/work/native-build" "$HOME/work/rexglue-sdk-android/out" -name "$1" -type f | head -1; }
          for so in librexruntimerd.so librexgpu-xenosrd.so librb2probe.so; do
            src="$(find_lib "$so")"; [ -n "$src" ] || { echo "missing $so"; exit 1; }
            cp "$src" "new/lib/arm64-v8a/$so"
            "$STRIP" --strip-unneeded "new/lib/arm64-v8a/$so"
            unzip -q -o official.apk "lib/arm64-v8a/$so" -d old
            echo "== $so: official $(stat -c%s old/lib/arm64-v8a/$so) bytes, new $(stat -c%s new/lib/arm64-v8a/$so) bytes"
          done
          # Interface check: libmain.so (kept from the official APK) must find every symbol it uses.
          unzip -q -o official.apk lib/arm64-v8a/libmain.so -d old
          "$NM" -D --undefined-only old/lib/arm64-v8a/libmain.so | awk '{print $NF}' | sort -u > need.txt
          "$NM" -D --defined-only old/lib/arm64-v8a/librexruntimerd.so | awk '{print $NF}' | sort -u > old_def.txt
          "$NM" -D --defined-only new/lib/arm64-v8a/librexruntimerd.so | awk '{print $NF}' | sort -u > new_def.txt
          comm -12 need.txt old_def.txt > need_from_runtime.txt
          missing="$(comm -23 need_from_runtime.txt new_def.txt)"
          echo "libmain.so uses $(wc -l < need_from_runtime.txt) runtime symbols"
          if [ -n "$missing" ]; then echo "MISSING in rebuilt runtime:"; echo "$missing" | head -50; exit 1; fi
          for so in librexgpu-xenosrd.so; do
            "$NM" -D --defined-only old/lib/arm64-v8a/$so | awk '{print $NF}' | sort -u > a.txt
            "$NM" -D --defined-only new/lib/arm64-v8a/$so | awk '{print $NF}' | sort -u > b.txt
            gone="$(comm -23 a.txt b.txt)"
            if [ -n "$gone" ]; then echo "Symbols gone from $so:"; echo "$gone" | head -50; exit 1; fi
          done
          # Replace the libraries (stored, like the original), align and sign.
          cp official.apk unsigned.apk
          zip -q -d unsigned.apk 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.MF' || true
          (cd new && zip -q -0 ../unsigned.apk lib/arm64-v8a/*.so)
          "$BT/zipalign" -f -P 16 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore rb2mali.jks -alias rb2mali -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass rb2mali -keypass rb2mali -dname "CN=RB2 Mali" > /dev/null 2>&1
          "$BT/apksigner" sign --ks rb2mali.jks --ks-pass pass:rb2mali --key-pass pass:rb2mali \
            --out RB2-Android-Mali.apk aligned.apk
          "$BT/apksigner" verify --print-certs RB2-Android-Mali.apk | head -3
          ls -la RB2-Android-Mali.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RB2-Android-Mali
          path: ~/work/apk/RB2-Android-Mali.apk
          retention-days: 30
